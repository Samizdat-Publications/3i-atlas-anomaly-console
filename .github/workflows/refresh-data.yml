name: Refresh source data

# The console ships its datasets baked into the bundle, so they freeze at
# whatever the last build pulled. CNEOS adds fireball rows continuously. This
# re-pulls upstream once a month and opens a PULL REQUEST if anything actually
# changed — it never pushes to main, so a revision to a row the case files quote
# gets read by a human before it goes live.
#
# Run it by hand any time from the Actions tab; tick "ephemeris" there to also
# re-pull JPL Horizons (slower, and a much larger diff).

on:
  schedule:
    # 06:17 UTC on the 1st. Off the hour on purpose: scheduled runs cluster at
    # :00 across all of GitHub and get queued behind everyone else's.
    - cron: '17 6 1 * *'
  workflow_dispatch:
    inputs:
      ephemeris:
        description: 'Also re-pull JPL Horizons ephemerides (slow, large diff)'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Pull the CNEOS fireball catalog
        run: python tools/fetch_fireballs.py

      - name: Pull JPL Horizons ephemerides
        if: inputs.ephemeris
        run: python tools/fetch_ephemeris.py

      - name: Re-bake content and rebuild the bundle
        run: |
          python tools/bake_content.py
          python tools/build.py

      # The report exits 1 when the upstream data is byte-identical, which is the
      # normal outcome for the ephemeris and a slow month for CNEOS.
      - name: Describe what changed
        id: report
        run: |
          if python tools/refresh_report.py > /tmp/report.md; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            cat /tmp/report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Upstream data is unchanged — no pull request opened."
            echo "Upstream data is unchanged. Nothing to do." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Sanity-check the rebuilt bundle
        if: steps.report.outputs.changed == 'true'
        run: |
          # The offline build must never gain an external reference, and the
          # bundle must actually contain the data we just pulled.
          test "$(grep -c 'src="http' "_LATEST - 3I-ATLAS Anomaly Console.html")" = "0"
          grep -q 'ATLAS_FIREBALLS' public/index.html
          grep -q 'ATLAS_EPHEM' public/index.html
          python -c "import json,sys; d=json.load(open('data/fireballs.json')); sys.exit(0 if d['count']>1000 and d['located']>800 else 1)"

      - name: Open a pull request
        if: steps.report.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BRANCH="data-refresh/$(date -u +%Y-%m-%d)"
          git config user.name  "Samizdat-Publications"
          git config user.email "179866421+Samizdat-Publications@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "Data: refresh upstream datasets ($(date -u +%Y-%m-%d))" \
                     -m "Opened automatically by .github/workflows/refresh-data.yml. Regenerated by the fetchers and tools/build.py — no hand edits."
          git push --force origin "$BRANCH"
          if gh pr view "$BRANCH" --json number >/dev/null 2>&1; then
            gh pr edit "$BRANCH" --body-file /tmp/report.md
            echo "::notice::Updated the existing pull request for $BRANCH."
          else
            gh pr create \
              --base main --head "$BRANCH" \
              --title "Data refresh — $(date -u +%Y-%m-%d)" \
              --body-file /tmp/report.md
          fi
