name: Deploy to Cloudflare Pages

# Publishes public/ to the 3i-atlas-anomaly-console Pages project on every push
# to main. OPTIONAL - until the CLOUDFLARE_API_TOKEN secret exists the deploy
# step is skipped with a notice and the run still passes.
#
# To enable:
#   1. Cloudflare dashboard -> My Profile -> API Tokens -> Create Token
#      -> "Edit Cloudflare Workers" template. Set Account Resources to your
#      account; the Zone/Workers Routes row can be removed.
#   2. On the final screen copy the TOKEN VALUE (a ~40-char random string) --
#      NOT the token's name.
#   3. gh secret set CLOUDFLARE_API_TOKEN --repo Samizdat-Publications/3i-atlas-anomaly-console
#
# Manual deploy any time (wrangler is logged in on Stewart's machine):
#   python tools/build.py && npx wrangler pages deploy public --project-name 3i-atlas-anomaly-console
#
# Wrangler bundles a functions/ folder from its WORKING directory into the
# project. The repo root holds the landing page's functions/ (site/, project
# 3i-atlas-landing), so the deploy runs from inside public/ to keep it out.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Two quick pushes must not race two deploys onto the same project.
concurrency:
  group: deploy-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      # Rebuild from src/ so a deploy can never ship stale bundled output.
      - name: Build single-file bundle
        run: python tools/build.py

      - name: Fail if the committed bundle is stale
        run: git diff --exit-code -- public/index.html

      # Until CLOUDFLARE_API_TOKEN exists the deploy is skipped with a notice
      # rather than failing the run. Add the secret and it starts working -
      # no edit to this file needed.
      - name: Is the Cloudflare token configured?
        id: check
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          # A real Cloudflare API token is a ~40-char string with no spaces.
          # Length-check it so a mistakenly pasted token *name* skips instead
          # of failing the run with an opaque auth error.
          if [ -z "$TOKEN" ]; then
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN is not set - skipping deploy. Add it with: gh secret set CLOUDFLARE_API_TOKEN --repo Samizdat-Publications/3i-atlas-anomaly-console"
          elif [ "${#TOKEN}" -lt 30 ] || [ "$TOKEN" != "${TOKEN// /}" ]; then
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CLOUDFLARE_API_TOKEN does not look like a Cloudflare API token (too short, or contains spaces). Did you paste the token NAME instead of its VALUE? Skipping deploy."
          else
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy
        if: steps.check.outputs.has_token == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: c82dd5addf7f4ebc0260ae476166b8d1
          workingDirectory: public
          command: pages deploy . --project-name 3i-atlas-anomaly-console --branch main

      - name: Deploy skipped
        if: steps.check.outputs.has_token != 'true'
        run: echo "Deploy skipped - no token. The live site is unaffected; deploy manually with 'npx wrangler pages deploy public --project-name 3i-atlas-anomaly-console'."
